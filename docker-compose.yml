version: '3.8'

# Production-shaped local topology:
#   postgres (pgvector)  — durable AI store + embeddings
#   redis                — job dispatch queue + transient input cache
#   migrate              — one-shot `alembic upgrade head` (runs, then exits)
#   ai-service           — FastAPI API (demo + /internal endpoints)
#   ai-worker            — RQ worker draining the queue (runs the LangGraph pipeline)
#
# The API and worker are separate processes that share Postgres (durable state)
# and Redis (dispatch), so you can scale each independently.

x-ai-env: &ai-env
  ENV: ${ENV:-development}
  PYTHONUNBUFFERED: "1"
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
  AI_INTERNAL_SERVICE_TOKEN: ${AI_INTERNAL_SERVICE_TOKEN:-dev-internal-token}
  DATABASE_URL: postgresql+asyncpg://ai:ai@postgres:5432/ai_pipeline
  REDIS_URL: redis://redis:6379/0
  QUEUE_NAME: ${QUEUE_NAME:-ai_jobs}
  LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
  ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-false}
  ENABLE_HYBRID_RETRIEVAL: ${ENABLE_HYBRID_RETRIEVAL:-false}

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-pipeline-postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_pipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-pipeline-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: shawky2002/ai-pipeline-service:rag-mvp
    container_name: ai-pipeline-migrate
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./ai-service/.env
    environment:
      <<: *ai-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: shawky2002/ai-pipeline-service:rag-mvp
    container_name: ai-pipeline-service-rag-mvp
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./ai-service/.env
    environment:
      <<: *ai-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ai-worker:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: shawky2002/ai-pipeline-service:rag-mvp
    container_name: ai-pipeline-worker
    command: ["python", "-m", "app.worker.main"]
    volumes:
      - ./ai-service:/app
    env_file:
      - ./ai-service/.env
    environment:
      <<: *ai-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
