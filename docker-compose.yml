version: '3.8'

services:
  ai-service:
    build: 
      context: ./ai-service
      dockerfile: Dockerfile
    image: shawky2002/ai-pipeline-service:latest
    container_name: ai-pipeline-service
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - ENV=development
      - PYTHONUNBUFFERED=1
      # CORS origins for browser callers in direct-demo mode. Comma-separated.
      # In ENV=production this MUST be set explicitly — empty + production
      # blocks all browser origins. Add the frontend URL when deploying.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
