name: Deploy to Northflank

on:
  push:
    branches:
      - feat/doc-audio-processing
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Northflank Build & Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js & Northflank CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Northflank CLI
        run: npm install -g @northflank/cli

      - name: Configure Northflank Token
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
        run: |
          if [ -z "$NORTHFLANK_API_TOKEN" ]; then
            echo "::error::NORTHFLANK_API_TOKEN secret is not set."
            exit 1
          fi
          northflank login --token "$NORTHFLANK_API_TOKEN"

      - name: Deploy Services via Northflank CLI
        env:
          NORTHFLANK_PROJECT: requra-ai
        run: |
          echo "Triggering deployment for requra-ai-api..."
          northflank create service combined --project "$NORTHFLANK_PROJECT" -f deployment/northflank/api-service.json || echo "Service updated/existing"
          northflank create service deployment --project "$NORTHFLANK_PROJECT" -f deployment/northflank/worker-service.json || echo "Worker updated/existing"
