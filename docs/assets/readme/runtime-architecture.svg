<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Requra.AI runtime architecture</title>
  <desc id="desc">An external caller submits to FastAPI, which creates a durable job and dispatches through an in-process or Redis queue. A worker runs LangGraph with model providers, persists results to PostgreSQL and pgvector, and exposes polling with an optional callback.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6D5DFB"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#CBD5E1" opacity=".28"/></pattern>
  </defs>
  <rect width="1200" height="650" rx="24" fill="#F8FAFC"/><rect width="1200" height="650" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="648" rx="23" fill="none" stroke="#CBD5E1"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="54" y="54" fill="#0B1020" font-size="26" font-weight="800">Production-shaped asynchronous runtime</text>
    <text x="54" y="82" fill="#64748B" font-size="15">API and worker scale independently; PostgreSQL is authoritative, while Redis carries dispatch and short-lived input.</text>

    <rect x="42" y="112" width="1116" height="104" rx="18" fill="#FFF" stroke="#CBD5E1" stroke-dasharray="6 5"/>
    <text x="62" y="138" fill="#64748B" font-size="13" font-weight="700" letter-spacing="1.5">EXTERNAL SYSTEMS</text>
    <g transform="translate(80 155)"><rect width="210" height="44" rx="12" fill="#EEF2FF" stroke="#6D5DFB"/><text x="105" y="27" text-anchor="middle" fill="#312E81" font-size="16" font-weight="700">Backend / caller</text></g>
    <g transform="translate(500 155)"><rect width="210" height="44" rx="12" fill="#ECFEFF" stroke="#22D3EE"/><text x="105" y="27" text-anchor="middle" fill="#155E75" font-size="16" font-weight="700">LLM · STT · embeddings</text></g>
    <g transform="translate(870 155)"><rect width="210" height="44" rx="12" fill="#ECFDF5" stroke="#10B981"/><text x="105" y="27" text-anchor="middle" fill="#065F46" font-size="16" font-weight="700">Polling / callback</text></g>

    <rect x="42" y="238" width="1116" height="344" rx="18" fill="#FFF" stroke="#CBD5E1"/>
    <text x="62" y="266" fill="#64748B" font-size="13" font-weight="700" letter-spacing="1.5">REQURA.AI SERVICE BOUNDARY</text>

    <g transform="translate(80 305)"><rect width="250" height="92" rx="16" fill="#EEF2FF" stroke="#6D5DFB" stroke-width="2"/><text x="125" y="31" text-anchor="middle" fill="#312E81" font-size="18" font-weight="800">FastAPI API process</text><text x="125" y="56" text-anchor="middle" fill="#475569" font-size="14">auth · validation · fingerprint</text><text x="125" y="76" text-anchor="middle" fill="#475569" font-size="14">job creation · status · results</text></g>
    <g transform="translate(475 305)"><rect width="250" height="92" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><text x="125" y="31" text-anchor="middle" fill="#5B21B6" font-size="18" font-weight="800">Worker process</text><text x="125" y="56" text-anchor="middle" fill="#475569" font-size="14">input recovery · cancellation</text><text x="125" y="76" text-anchor="middle" fill="#475569" font-size="14">persistence · callback attempt</text></g>
    <g transform="translate(870 305)"><rect width="210" height="92" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/><text x="105" y="31" text-anchor="middle" fill="#155E75" font-size="18" font-weight="800">LangGraph</text><text x="105" y="56" text-anchor="middle" fill="#475569" font-size="14">15 nodes</text><text x="105" y="76" text-anchor="middle" fill="#475569" font-size="14">bounded repair loop</text></g>

    <g transform="translate(80 455)"><rect width="250" height="84" rx="16" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><text x="125" y="30" text-anchor="middle" fill="#92400E" font-size="17" font-weight="800">Transient dispatch</text><text x="125" y="54" text-anchor="middle" fill="#475569" font-size="14">in-process or Redis/RQ</text><text x="125" y="73" text-anchor="middle" fill="#92400E" font-size="13">Redis input TTL: 6 hours</text></g>
    <g transform="translate(475 455)"><rect width="250" height="84" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="125" y="30" text-anchor="middle" fill="#065F46" font-size="17" font-weight="800">Durable state</text><text x="125" y="54" text-anchor="middle" fill="#475569" font-size="14">PostgreSQL · Alembic</text><text x="125" y="73" text-anchor="middle" fill="#065F46" font-size="13">jobs · chunks · results · events</text></g>
    <g transform="translate(870 455)"><rect width="210" height="84" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="105" y="30" text-anchor="middle" fill="#065F46" font-size="17" font-weight="800">pgvector</text><text x="105" y="54" text-anchor="middle" fill="#475569" font-size="14">optional embeddings</text><text x="105" y="73" text-anchor="middle" fill="#065F46" font-size="13">scoped vector search</text></g>

    <g fill="none" stroke="#6D5DFB" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M185 199V292"/><path d="M725 351H857"/>
      <path d="M205 397V442"/><path d="M330 497H400Q440 497 440 455V410Q440 351 462 351"/>
      <path d="M330 380Q395 430 475 475"/><path d="M600 397V442"/><path d="M725 497H857"/>
      <path d="M975 305V213"/><path d="M975 397V442"/>
    </g>
    <path d="M975 305V236Q975 225 958 225H622Q605 225 605 212" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="384" y="485" fill="#6D5DFB" font-size="13" font-weight="700">dispatch</text><text x="760" y="339" fill="#6D5DFB" font-size="13" font-weight="700">execute</text>

    <g transform="translate(42 604)">
      <circle cx="9" cy="9" r="7" fill="#10B981"/><text x="24" y="14" fill="#475569" font-size="14">durable</text>
      <circle cx="126" cy="9" r="7" fill="#F59E0B"/><text x="141" y="14" fill="#475569" font-size="14">transient</text>
      <circle cx="253" cy="9" r="7" fill="#22D3EE"/><text x="268" y="14" fill="#475569" font-size="14">external provider</text>
      <text x="1116" y="14" text-anchor="end" fill="#64748B" font-size="13">Polling remains available if the best-effort callback fails.</text>
    </g>
  </g>
</svg>
