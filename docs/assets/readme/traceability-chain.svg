<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Requra.AI evidence traceability chain</title>
  <desc id="desc">A source quote is retrieved from a source chunk, classified as a requirement, transformed into a user story and acceptance criteria, and retained as a final source reference.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6D5DFB"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#CBD5E1" opacity=".3"/></pattern></defs>
  <rect width="1200" height="360" rx="24" fill="#F8FAFC"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#CBD5E1"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="50" y="54" fill="#0B1020" font-size="26" font-weight="800">Requirements you can trace</text><text x="50" y="80" fill="#64748B" font-size="15">Retrieval improves recall; verbatim quote verification preserves the trust boundary.</text>
    <g fill="none" stroke="#6D5DFB" stroke-width="2.5" marker-end="url(#arrow)"><path d="M204 178H226"/><path d="M390 178H412"/><path d="M576 178H598"/><path d="M762 178H784"/><path d="M948 178H970"/></g>
    <g transform="translate(40 122)"><rect width="164" height="112" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/><text x="82" y="31" text-anchor="middle" fill="#155E75" font-size="15" font-weight="800">SOURCE QUOTE</text><text x="18" y="58" fill="#475569" font-size="13">“Reset links expire</text><text x="18" y="78" fill="#475569" font-size="13">after 15 minutes.”</text><text x="18" y="99" fill="#0891B2" font-size="12">chunk-04 · page 2</text></g>
    <g transform="translate(226 122)"><rect width="164" height="112" rx="16" fill="#EEF2FF" stroke="#6D5DFB" stroke-width="2"/><text x="82" y="31" text-anchor="middle" fill="#312E81" font-size="15" font-weight="800">REQUIREMENT</text><text x="18" y="58" fill="#475569" font-size="13">Time-bound password</text><text x="18" y="78" fill="#475569" font-size="13">reset link</text><text x="18" y="99" fill="#6D5DFB" font-size="12">REQ-001 · confidence</text></g>
    <g transform="translate(412 122)"><rect width="164" height="112" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><text x="82" y="31" text-anchor="middle" fill="#5B21B6" font-size="15" font-weight="800">CLASSIFICATION</text><text x="18" y="61" fill="#475569" font-size="13">Business rule</text><text x="18" y="82" fill="#475569" font-size="13">Priority: High</text><text x="18" y="101" fill="#8B5CF6" font-size="12">grounding checked</text></g>
    <g transform="translate(598 122)"><rect width="164" height="112" rx="16" fill="#EEF2FF" stroke="#6D5DFB" stroke-width="2"/><text x="82" y="31" text-anchor="middle" fill="#312E81" font-size="15" font-weight="800">USER STORY</text><text x="18" y="58" fill="#475569" font-size="13">As a customer,</text><text x="18" y="78" fill="#475569" font-size="13">I want a reset link…</text><text x="18" y="99" fill="#6D5DFB" font-size="12">US-001 · REQ-001</text></g>
    <g transform="translate(784 122)"><rect width="164" height="112" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="82" y="31" text-anchor="middle" fill="#065F46" font-size="15" font-weight="800">ACCEPTANCE</text><text x="18" y="58" fill="#475569" font-size="13">Given · When · Then</text><text x="18" y="78" fill="#475569" font-size="13">minimum quality rules</text><text x="18" y="99" fill="#059669" font-size="12">validated + scored</text></g>
    <g transform="translate(970 122)"><rect width="190" height="112" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="95" y="31" text-anchor="middle" fill="#065F46" font-size="15" font-weight="800">FINAL REFERENCES</text><text x="18" y="58" fill="#475569" font-size="13">source_refs in result</text><text x="18" y="78" fill="#475569" font-size="13">Excel-ready rows</text><text x="18" y="99" fill="#059669" font-size="12">Jira-compatible data</text></g>
    <path d="M122 252C122 314 1060 314 1060 252" fill="none" stroke="#22D3EE" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="590" y="315" text-anchor="middle" fill="#0E7490" font-size="14" font-weight="700">the original evidence travels with the delivery artifact</text>
  </g>
</svg>
