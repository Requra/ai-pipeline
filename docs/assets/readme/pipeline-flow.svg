<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Requra.AI fifteen-node LangGraph pipeline</title>
  <desc id="desc">The pipeline detects and ingests input, conditionally transcribes audio, chunks and indexes sources, extracts and grounds requirements, generates stories, runs a bounded quality repair loop, summarizes, and formats the final result. Rejected inputs short-circuit to format.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6D5DFB"/></marker>
    <marker id="amber-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#F59E0B"/></marker>
    <marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#10B981"/></marker>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="#CBD5E1" opacity=".25"/></pattern>
  </defs>
  <rect width="1400" height="800" rx="24" fill="#F8FAFC"/><rect width="1400" height="800" rx="24" fill="url(#grid)"/><rect x="1" y="1" width="1398" height="798" rx="23" fill="none" stroke="#CBD5E1"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="52" y="52" fill="#0B1020" font-size="27" font-weight="800">The 15-node execution graph</text>
    <text x="52" y="80" fill="#64748B" font-size="15">Conditional input routing, source grounding, and a configuration-bounded quality repair cycle.</text>

    <g font-size="13" font-weight="800" letter-spacing="1.2">
      <text x="52" y="126" fill="#5B21B6">INPUT SAFETY + SOURCE PROCESSING</text>
      <text x="52" y="348" fill="#155E75">REQUIREMENT INTELLIGENCE + EVIDENCE</text>
      <text x="52" y="570" fill="#065F46">STORY GENERATION + QUALITY + DELIVERY</text>
    </g>

    <!-- row 1 -->
    <g transform="translate(52 148)"><rect width="220" height="128" rx="16" fill="#EEF2FF" stroke="#6D5DFB" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#6D5DFB"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">1</text><text x="54" y="34" fill="#312E81" font-size="17" font-weight="800">detect_file_type</text><text x="22" y="66" fill="#475569" font-size="14">Inspect signature, media type,</text><text x="22" y="88" fill="#475569" font-size="14">size, and checksum metadata.</text><text x="22" y="112" fill="#6D5DFB" font-size="12" font-weight="700">Input safety</text></g>
    <g transform="translate(318 148)"><rect width="220" height="128" rx="16" fill="#EEF2FF" stroke="#6D5DFB" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#6D5DFB"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">2</text><text x="54" y="34" fill="#312E81" font-size="17" font-weight="800">ingest</text><text x="22" y="66" fill="#475569" font-size="14">Extract text, normalize, mask</text><text x="22" y="88" fill="#475569" font-size="14">PII, and score relevance.</text><text x="22" y="112" fill="#6D5DFB" font-size="12" font-weight="700">Rejected → format</text></g>
    <g transform="translate(584 148)"><rect width="220" height="128" rx="16" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#F59E0B"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">3</text><text x="54" y="34" fill="#92400E" font-size="17" font-weight="800">transcribe</text><text x="22" y="66" fill="#475569" font-size="14">Groq or Deepgram STT with</text><text x="22" y="88" fill="#475569" font-size="14">bounded audio processing.</text><text x="22" y="112" fill="#92400E" font-size="12" font-weight="700">Audio branch only</text></g>
    <g transform="translate(850 148)"><rect width="220" height="128" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0891B2"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">4</text><text x="54" y="34" fill="#155E75" font-size="17" font-weight="800">parse_to_chunks</text><text x="22" y="66" fill="#475569" font-size="14">Preserve page, speaker, time,</text><text x="22" y="88" fill="#475569" font-size="14">document, and text offsets.</text><text x="22" y="112" fill="#0891B2" font-size="12" font-weight="700">Source chunks</text></g>
    <g transform="translate(1116 148)"><rect width="232" height="128" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0891B2"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">5</text><text x="54" y="34" fill="#155E75" font-size="16" font-weight="800">build_source_index</text><text x="22" y="66" fill="#475569" font-size="14">Per-job BM25 index; optional</text><text x="22" y="88" fill="#475569" font-size="14">persisted chunk embeddings.</text><text x="22" y="112" fill="#0891B2" font-size="12" font-weight="700">Retrieval handle + stats</text></g>

    <!-- row 2 -->
    <g transform="translate(52 370)"><rect width="220" height="128" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">6</text><text x="54" y="34" fill="#5B21B6" font-size="17" font-weight="800">extract</text><text x="22" y="66" fill="#475569" font-size="14">Structured requirements with</text><text x="22" y="88" fill="#475569" font-size="14">evidence, priority, confidence.</text><text x="22" y="112" fill="#8B5CF6" font-size="12" font-weight="700">Requirement candidates</text></g>
    <g transform="translate(318 370)"><rect width="220" height="128" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">7</text><text x="54" y="34" fill="#5B21B6" font-size="16" font-weight="800">dedupe_requirements</text><text x="22" y="66" fill="#475569" font-size="14">Merge exact/near duplicates;</text><text x="22" y="88" fill="#475569" font-size="14">optionally flag conflicts.</text><text x="22" y="112" fill="#8B5CF6" font-size="12" font-weight="700">Canonical requirements</text></g>
    <g transform="translate(584 370)"><rect width="220" height="128" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0891B2"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">8</text><text x="54" y="34" fill="#155E75" font-size="16" font-weight="800">retrieve_evidence</text><text x="22" y="66" fill="#475569" font-size="14">BM25 or optional hybrid hits,</text><text x="22" y="88" fill="#475569" font-size="14">scores, capped source quotes.</text><text x="22" y="112" fill="#0891B2" font-size="12" font-weight="700">Grounding context</text></g>
    <g transform="translate(850 370)"><rect width="220" height="128" rx="16" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">9</text><text x="54" y="34" fill="#5B21B6" font-size="17" font-weight="800">classify</text><text x="22" y="66" fill="#475569" font-size="14">FR, NFR, business rules,</text><text x="22" y="88" fill="#475569" font-size="14">constraints and non-story items.</text><text x="22" y="112" fill="#8B5CF6" font-size="12" font-weight="700">Labels + confidence</text></g>
    <g transform="translate(1116 370)"><rect width="232" height="128" rx="16" fill="#ECFEFF" stroke="#22D3EE" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#0891B2"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">10</text><text x="54" y="34" fill="#155E75" font-size="16" font-weight="800">evidence_grounding</text><text x="22" y="66" fill="#475569" font-size="14">Verify non-empty quotes exist</text><text x="22" y="88" fill="#475569" font-size="14">verbatim in source chunks.</text><text x="22" y="112" fill="#0891B2" font-size="12" font-weight="700">Quality issues / review</text></g>

    <!-- row 3 -->
    <g transform="translate(52 592)"><rect width="220" height="128" rx="16" fill="#EEF2FF" stroke="#6D5DFB" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#6D5DFB"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">11</text><text x="54" y="34" fill="#312E81" font-size="17" font-weight="800">generate</text><text x="22" y="66" fill="#475569" font-size="14">Stories, Given–When–Then AC,</text><text x="22" y="88" fill="#475569" font-size="14">and flexible coverage mapping.</text><text x="22" y="112" fill="#6D5DFB" font-size="12" font-weight="700">Deterministic fallback</text></g>
    <g transform="translate(318 592)"><rect width="220" height="128" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#10B981"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">12</text><text x="54" y="34" fill="#065F46" font-size="17" font-weight="800">quality_gate</text><text x="22" y="66" fill="#475569" font-size="14">Validate evidence, stories, AC,</text><text x="22" y="88" fill="#475569" font-size="14">coverage; compute quality report.</text><text x="22" y="112" fill="#059669" font-size="12" font-weight="700">Pass or repair route</text></g>
    <g transform="translate(584 592)"><rect width="220" height="128" rx="16" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#F59E0B"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">13</text><text x="54" y="34" fill="#92400E" font-size="17" font-weight="800">repair_stories</text><text x="22" y="66" fill="#475569" font-size="14">Repair configured story issues,</text><text x="22" y="88" fill="#475569" font-size="14">then return for revalidation.</text><text x="22" y="112" fill="#92400E" font-size="12" font-weight="700">Optional + attempt-bounded</text></g>
    <g transform="translate(850 592)"><rect width="220" height="128" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#10B981"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">14</text><text x="54" y="34" fill="#065F46" font-size="17" font-weight="800">summarize</text><text x="22" y="66" fill="#475569" font-size="14">Structured executive summary,</text><text x="22" y="88" fill="#475569" font-size="14">risks, decisions, open questions.</text><text x="22" y="112" fill="#059669" font-size="12" font-weight="700">Bounded artifact digest</text></g>
    <g transform="translate(1116 592)"><rect width="232" height="128" rx="16" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><circle cx="28" cy="28" r="17" fill="#10B981"/><text x="28" y="34" text-anchor="middle" fill="#FFF" font-size="14" font-weight="800">15</text><text x="54" y="34" fill="#065F46" font-size="17" font-weight="800">format</text><text x="22" y="66" fill="#475569" font-size="14">Map V1 result, source refs,</text><text x="22" y="88" fill="#475569" font-size="14">quality and export structures.</text><text x="22" y="112" fill="#059669" font-size="12" font-weight="700">Final JobResult</text></g>

    <!-- main flow arrows -->
    <g fill="none" stroke="#6D5DFB" stroke-width="2.5" marker-end="url(#arrow)"><path d="M272 212H305"/><path d="M538 212H571"/><path d="M804 212H837"/><path d="M1070 212H1103"/><path d="M1232 276V324Q1232 330 1220 330H174Q162 330 162 357"/><path d="M272 434H305"/><path d="M538 434H571"/><path d="M804 434H837"/><path d="M1070 434H1103"/><path d="M1232 498V546Q1232 552 1220 552H174Q162 552 162 579"/><path d="M272 656H305"/></g>
    <path d="M428 276V304Q428 314 446 314H920Q960 314 960 289V276" fill="none" stroke="#22D3EE" stroke-width="2.5" marker-end="url(#arrow)"/><text x="670" y="306" text-anchor="middle" fill="#0E7490" font-size="13" font-weight="700">non-audio skips transcription</text>
    <path d="M428 148V112Q428 102 446 102H1308Q1332 102 1332 124V579" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#amber-arrow)"/><text x="890" y="96" text-anchor="middle" fill="#92400E" font-size="13" font-weight="700">rejected or failed input short-circuits to format</text>
    <path d="M538 656H571" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#amber-arrow)"/><text x="554" y="645" text-anchor="middle" fill="#92400E" font-size="12" font-weight="700">repair</text>
    <path d="M694 592V558Q694 544 678 544H444Q428 544 428 579" fill="none" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#amber-arrow)"/><text x="562" y="536" text-anchor="middle" fill="#92400E" font-size="13" font-weight="700">revalidate until attempt limit</text>
    <path d="M538 684Q694 758 850 684" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#green-arrow)"/><text x="694" y="754" text-anchor="middle" fill="#065F46" font-size="13" font-weight="700">pass / repair disabled / limit reached</text>
    <path d="M1070 656H1103" fill="none" stroke="#10B981" stroke-width="2.5" marker-end="url(#green-arrow)"/>
  </g>
</svg>
