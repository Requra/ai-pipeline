[tool.poetry]
name = "ai-service"
version = "0.1.0"
description = "AI pipeline service powered by LangGraph"
authors = ["AI Team <engineering@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
langgraph = "^0.0.26"
langchain = "^0.1.0"
langchain-openai = "^0.0.5"
langchain-anthropic = "^0.1.1"
langchain-google-genai = "^0.0.11"
pydantic = "^2.6.0"
python-multipart = "^0.0.6"
python-dotenv = "^1.0.0"
pymupdf = "^1.24.1"
python-docx = "^1.1.0"
groq = "^0.5.0"
httpx = "^0.27.0"
pydub = "^0.25.1"
# --- Production infrastructure (durable store, migrations, queue) ---
# The service runs fully in-memory without these (dev/demo/tests); they are
# imported lazily and only required once DATABASE_URL / REDIS_URL are set. They
# are declared here so the production image ships with them.
sqlalchemy = {version = "^2.0.30", extras = ["asyncio"]}
asyncpg = "^0.29.0"
greenlet = "^3.0.0"
alembic = "^1.13.0"
pgvector = "^0.2.5"
redis = "^5.0.0"
rq = "^1.16.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.5"
black = "^24.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
